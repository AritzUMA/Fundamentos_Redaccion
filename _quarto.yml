project:
  type: website
  output-dir: _site

website:
  title: "Fundamentos de Redacción Audiovisual"
  description: "Recursos docentes de edición de vídeo con DaVinci Resolve y Adobe Premiere Pro"
  navbar:
    background: dark
    foreground: light
    title: "🎬 Edición de Vídeo"
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "DaVinci Resolve"
        menu:
          - text: "Introducción e interfaz"
            href: davinci/intro.qmd
          - text: "Práctica 1 — Anuncio BMW"
            href: davinci/practica1.qmd
      - text: "Adobe Premiere"
        menu:
          - text: "Introducción e interfaz"
            href: premiere/intro.qmd
      - text: "Recursos"
        href: recursos.qmd
    right:
      - icon: github
        href: https://github.com/AritzUMA/Fundamentos_Redaccion
        aria-label: GitHub

  page-footer:
    left: "Fundamentos de Redacción Audiovisual"
    right: "Aritz Gorostiza-Cerviño · UMA"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    smooth-scroll: true
    highlight-style: github
    link-external-newwindow: true
