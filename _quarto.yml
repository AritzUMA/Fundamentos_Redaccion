project:
  type: website
  output-dir: _site

website:
  title: "Edición de Vídeo"
  description: "Recursos para las clases de DaVinci Resolve y Adobe Premiere Pro"
  favicon: "assets/favicon.ico"
  navbar:
    background: dark
    foreground: light
    logo: "assets/logo.png"
    title: "🎬 Edición de Vídeo"
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "DaVinci Resolve"
        menu:
          - text: "Introducción"
            href: davinci/intro.qmd
          - text: "Práctica 1 — Anuncio BMW"
            href: davinci/practica1.qmd
      - text: "Adobe Premiere"
        menu:
          - text: "Introducción"
            href: premiere/intro.qmd
      - text: "Recursos"
        href: recursos.qmd
    right:
      - icon: github
        href: https://github.com/AritzUMA/edicion-video
        aria-label: GitHub

  sidebar: false

  page-footer:
    left: "Recursos docentes de edición de vídeo"
    right: "Aritz Gorostiza-Cerviño · UMA"

format:
  html:
    theme:
      - cosmo
      - styles.css
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    smooth-scroll: true
    code-tools: false
    highlight-style: github
    link-external-newwindow: true
